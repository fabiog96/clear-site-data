name: ci
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate manifest
        run: jq -e '.manifest_version == 3 and (.version | test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' manifest.json

      - name: Check JavaScript syntax
        run: node --check background.js

      - name: Package extension
        id: package
        run: |
          NAME="clear-site-data-$(jq -r .version manifest.json).zip"
          zip -r "$NAME" manifest.json background.js icons/
          echo "zip_name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: ${{ steps.package.outputs.zip_name }}
